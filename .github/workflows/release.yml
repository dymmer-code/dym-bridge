name: Release

on:
  push:
    tags:
      - "v*"
  # A manual run builds, signs and notarizes everything but publishes nothing: to check the secrets without a tag.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, goos: darwin, goarch: arm64}
          - {os: macos-15-intel, goos: darwin, goarch: amd64}
          - {os: ubuntu-latest, goos: linux, goarch: amd64}
          - {os: windows-latest, goos: windows, goarch: amd64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        if: matrix.goos == 'darwin'
        with:
          python-version: "3.12"
      - name: DMG tools
        if: matrix.goos == 'darwin'
        run: make dmg-deps
      - name: Test
        run: go test ./...
        env:
          CGO_ENABLED: "0"
      - name: Build and package
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS_NAME: ${{ matrix.goos }}
          GOARCH_NAME: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION="v0.0.0-test" ;; esac
          NUM="${VERSION#v}"
          NAME="dym-bridge_${NUM}_${GOOS_NAME}_${GOARCH_NAME}"
          LDFLAGS="-s -w -X github.com/dymmer-code/dym-bridge/pkg/version.Version=${VERSION} -X github.com/dymmer-code/dym-bridge/pkg/version.GitCommit=$(git rev-parse --short HEAD) -X github.com/dymmer-code/dym-bridge/pkg/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist "stage/${NAME}"
          case "$GOOS_NAME" in
            darwin)
              make bundle-arch ARCH="$GOARCH_NAME" VERSION="$VERSION"
              make dmg-package
              cp bin/dym-bridge.dmg "dist/${NAME}.dmg"
              ;;
            linux)
              go build -ldflags="$LDFLAGS" -o "stage/${NAME}/dym-bridge" ./cmd/dym-bridge
              cp packaging/linux/dym-bridge.desktop dym-bridge.png "stage/${NAME}/"
              tar -C stage -czf "dist/${NAME}.tar.gz" "${NAME}"
              ;;
            windows)
              go build -ldflags="${LDFLAGS} -H=windowsgui" -o "stage/${NAME}/dym-bridge.exe" ./cmd/dym-bridge
              cp packaging/windows/dym-bridge-protocol.reg "stage/${NAME}/"
              (cd stage && 7z a -tzip "../dist/${NAME}.zip" "${NAME}")
              ;;
          esac
          ls -l dist
      - name: Sign, notarize and pack the disk image (macOS)
        if: matrix.goos == 'darwin'
        shell: bash
        env:
          APPLE_CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          GOARCH_NAME: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERT_P12:-}" ] || [ -z "${APPLE_API_KEY:-}" ]; then
            echo "::warning::No Apple signing secrets: the macOS DMG is NOT signed or notarized"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION="v0.0.0-test" ;; esac
          NAME="dym-bridge_${VERSION#v}_darwin_${GOARCH_NAME}"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PW="$(uuidgen)"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$IDENTITY"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" bin/dym-bridge.app
          codesign --verify --strict --verbose=2 bin/dym-bridge.app
          make dmg-package
          cp bin/dym-bridge.dmg "dist/${NAME}.dmg"
          codesign --force --timestamp --sign "$IDENTITY" "dist/${NAME}.dmg"
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "dist/${NAME}.dmg" --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "dist/${NAME}.dmg"
          xcrun stapler validate "dist/${NAME}.dmg"
          spctl --assess --type open --context context:primary-signature -v "dist/${NAME}.dmg"
          # The signed disk image replaces the archive.
          rm -f "dist/${NAME}.tar.gz"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$KEYCHAIN"
          ls -l dist
      - name: Check Azure signing configuration (Windows)
        if: matrix.goos == 'windows'
        id: azure_signing
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          if [ -z "${AZURE_CLIENT_ID}" ] || [ -z "${AZURE_TENANT_ID}" ] || [ -z "${AZURE_SUBSCRIPTION_ID}" ] || [ -z "${AZURE_SIGNING_ENDPOINT}" ] || [ -z "${AZURE_SIGNING_ACCOUNT}" ] || [ -z "${AZURE_SIGNING_PROFILE}" ]; then
            echo "::warning::No Azure signing secrets: dym-bridge.exe is NOT signed"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            VERSION="${GITHUB_REF_NAME}"
            case "$VERSION" in v*) ;; *) VERSION="v0.0.0-test" ;; esac
            NAME="dym-bridge_${VERSION#v}_windows_${{ matrix.goarch }}"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "stage_dir=stage/${NAME}" >> "$GITHUB_OUTPUT"
            echo "zip_path=dist/${NAME}.zip" >> "$GITHUB_OUTPUT"
          fi
      - name: Azure login (OIDC)
        if: matrix.goos == 'windows' && steps.azure_signing.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows executable (Azure Artifact Signing)
        if: matrix.goos == 'windows' && steps.azure_signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/${{ steps.azure_signing.outputs.stage_dir }}
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify signature and repack archive (Windows)
        if: matrix.goos == 'windows' && steps.azure_signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $exe = "${{ steps.azure_signing.outputs.stage_dir }}/dym-bridge.exe"
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne 'Valid') {
            throw "Authenticode signature check failed for ${exe}: $($sig.Status) - $($sig.StatusMessage)"
          }
          Remove-Item -Force "${{ steps.azure_signing.outputs.zip_path }}"
          Push-Location stage
          7z a -tzip "../${{ steps.azure_signing.outputs.zip_path }}" (Split-Path -Leaf "${{ steps.azure_signing.outputs.stage_dir }}")
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum $(ls) > checksums.txt && cat checksums.txt
      - name: Create the release and upload the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME" || true
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/* --clobber
