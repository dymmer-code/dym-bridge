name: Release

on:
  push:
    tags:
      - "v*"
  # A manual run builds, signs and notarizes everything but publishes nothing: to check the secrets without a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, goos: darwin, goarch: arm64}
          - {os: macos-15-intel, goos: darwin, goarch: amd64}
          - {os: ubuntu-latest, goos: linux, goarch: amd64}
          - {os: windows-latest, goos: windows, goarch: amd64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Libraries the window toolkit needs
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols
      - name: Test
        run: go test ./...
      - name: Build and package
        shell: bash
        env:
          GOOS_NAME: ${{ matrix.goos }}
          GOARCH_NAME: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION="v0.0.0-test" ;; esac
          NUM="${VERSION#v}"
          NAME="dym-bridge_${NUM}_${GOOS_NAME}_${GOARCH_NAME}"
          LDFLAGS="-s -w -X github.com/dymmer-code/dym-bridge/pkg/version.Version=${VERSION} -X github.com/dymmer-code/dym-bridge/pkg/version.GitCommit=$(git rev-parse --short HEAD) -X github.com/dymmer-code/dym-bridge/pkg/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist "stage/${NAME}"
          case "$GOOS_NAME" in
            darwin)
              make bundle-arch ARCH="$GOARCH_NAME" VERSION="$VERSION"
              cp -R bin/dym-bridge.app "stage/${NAME}/"
              tar -C stage -czf "dist/${NAME}.tar.gz" "${NAME}"
              ;;
            linux)
              go build -ldflags="$LDFLAGS" -o "stage/${NAME}/dym-bridge" ./cmd/dym-bridge
              cp packaging/linux/dym-bridge.desktop dym-bridge.png "stage/${NAME}/"
              tar -C stage -czf "dist/${NAME}.tar.gz" "${NAME}"
              ;;
            windows)
              go build -ldflags="${LDFLAGS} -H=windowsgui" -o "stage/${NAME}/dym-bridge.exe" ./cmd/dym-bridge
              cp packaging/windows/dym-bridge-protocol.reg "stage/${NAME}/"
              (cd stage && 7z a -tzip "../dist/${NAME}.zip" "${NAME}")
              ;;
          esac
          ls -l dist
      - name: Sign, notarize and pack the disk image (macOS)
        if: matrix.goos == 'darwin'
        shell: bash
        env:
          APPLE_CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          GOARCH_NAME: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERT_P12:-}" ] || [ -z "${APPLE_API_KEY:-}" ]; then
            echo "::warning::No Apple signing secrets: the macOS archive is NOT signed or notarized"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION="v0.0.0-test" ;; esac
          NAME="dym-bridge_${VERSION#v}_darwin_${GOARCH_NAME}"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PW="$(uuidgen)"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$IDENTITY"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" bin/dym-bridge.app
          codesign --verify --strict --verbose=2 bin/dym-bridge.app
          rm -rf stage-dmg && mkdir stage-dmg
          cp -R bin/dym-bridge.app stage-dmg/
          ln -s /Applications stage-dmg/Applications
          hdiutil create -volname "dym-bridge" -srcfolder stage-dmg -ov -format UDZO "dist/${NAME}.dmg"
          codesign --force --timestamp --sign "$IDENTITY" "dist/${NAME}.dmg"
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "dist/${NAME}.dmg" --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "dist/${NAME}.dmg"
          xcrun stapler validate "dist/${NAME}.dmg"
          spctl --assess --type open --context context:primary-signature -v "dist/${NAME}.dmg"
          # The signed disk image replaces the archive.
          rm -f "dist/${NAME}.tar.gz"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$KEYCHAIN"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum $(ls) > checksums.txt && cat checksums.txt
      - name: Create the release and upload the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME" || true
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/* --clobber
